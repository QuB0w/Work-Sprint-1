services:
  # --- Infrastructure ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  users-db:
    image: postgres:16
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - users-data:/var/lib/postgresql/data

  events-db:
    image: postgres:16
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - events-data:/var/lib/postgresql/data

  bookings-db:
    image: postgres:16
    environment:
      POSTGRES_DB: bookings_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - bookings-data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Observability ---
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eventapi-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: eventapi-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: eventapi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # --- Services ---
  users-service:
    build:
      context: ./src
      dockerfile: Users/Dockerfile
    depends_on:
      - users-db
      - jaeger
    environment:
      ConnectionStrings__DefaultConnection: "Host=users-db;Port=5432;Database=users_db;Username=postgres;Password=postgres"
      Jwt__Secret: "ThisIsASuperSecretKeyForJwtThatMustBeAtLeast32Chars!"
      Jwt__Issuer: "EventApi"
      Jwt__Audience: "EventApiClients"
      Jwt__ExpiresInMinutes: "60"
      Otlp__Endpoint: "http://jaeger:4317"
    ports:
      - "5100:8080"

  events-service:
    build:
      context: ./src
      dockerfile: Events/Dockerfile
    depends_on:
      - events-db
      - kafka
      - redis
      - jaeger
    environment:
      ConnectionStrings__DefaultConnection: "Host=events-db;Port=5432;Database=events_db;Username=postgres;Password=postgres"
      Jwt__Secret: "ThisIsASuperSecretKeyForJwtThatMustBeAtLeast32Chars!"
      Jwt__Issuer: "EventApi"
      Jwt__Audience: "EventApiClients"
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__ConsumerGroup: "events-service"
      Redis__ConnectionString: "redis:6379"
      Otlp__Endpoint: "http://jaeger:4317"
    ports:
      - "5200:8080"

  bookings-service:
    build:
      context: ./src
      dockerfile: Bookings/Dockerfile
    depends_on:
      - bookings-db
      - kafka
      - jaeger
    environment:
      ConnectionStrings__DefaultConnection: "Host=bookings-db;Port=5432;Database=bookings_db;Username=postgres;Password=postgres"
      Jwt__Secret: "ThisIsASuperSecretKeyForJwtThatMustBeAtLeast32Chars!"
      Jwt__Issuer: "EventApi"
      Jwt__Audience: "EventApiClients"
      Kafka__BootstrapServers: "kafka:9092"
      Otlp__Endpoint: "http://jaeger:4317"
    ports:
      - "5300:8080"

volumes:
  users-data:
  events-data:
  bookings-data:
  grafana-data:
